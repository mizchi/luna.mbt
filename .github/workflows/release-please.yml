name: release-please

# Two triggers:
# 1. workflow_dispatch: maintainer runs this to create a Release PR
#    (CHANGELOG is auto-generated from accumulated Conventional Commits).
# 2. pull_request closed on main with head.ref starting with
#    "release-please--": fires automatically after merging the Release PR
#    so release-please itself creates the tag and GitHub Release without
#    requiring a second manual dispatch.
#
# Regular feat:/fix: PR merges do NOT start this workflow — the job-level
# `if` guard ensures only Release PR merges trigger tag creation.
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

# GITHUB_TOKEN is not handed to release-please. A dedicated GitHub App token
# is used instead so the repo-wide "Allow GitHub Actions to create and approve
# pull requests" setting can stay off.
permissions:
  contents: read

jobs:
  release-please:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.merged == true &&
         startsWith(github.event.pull_request.head.ref, 'release-please--'))
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          # App ID is safe to commit (cannot do anything by itself).
          # The matching private key (full PEM with BEGIN/END lines) lives
          # in the repo secret RELEASE_PLEASE_APP_PRIVATE_KEY.
          app-id: 3420845
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please's node-workspace plugin rewrites internal @luna_ui/*
      # dependency ranges in each package.json when it opens/updates the Release
      # PR, but it never touches pnpm-lock.yaml. The Release PR would then fail
      # CI's `pnpm install --frozen-lockfile` with ERR_PNPM_OUTDATED_LOCKFILE.
      # When a Release PR exists this run, regenerate the lockfile on its branch
      # and push the fix. Pushing to the PR branch re-triggers the normal CI
      # workflows (pull_request: synchronize) but NOT this one (no `push`
      # trigger), so there is no loop. The branch name is release-please's
      # deterministic convention for a single combined PR onto main.
      - name: Check out Release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: release-please--branches--main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        if: ${{ steps.release.outputs.pr }}
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Sync pnpm-lock.yaml with release-please bumps
        if: ${{ steps.release.outputs.pr }}
        run: |
          pnpm install --lockfile-only --ignore-scripts
          if [ -z "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "pnpm-lock.yaml already in sync — nothing to do"
            exit 0
          fi
          git config user.name "luna-release-please[bot]"
          git config user.email "luna-release-please[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml with release-please bumps"
          git push
