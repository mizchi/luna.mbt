name: sol

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "sol/**"
      - "js/sol/**"
      - "luna/src/**"
      - "luna/moon.mod"
      - "scripts/**"
      - "moon.work"
      # astra core only — astra/examples/** is owned by astra.yaml, not sol.
      - "astra/src/**"
      - "astra/moon.mod"
      - "astra/moon.pkg"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/sol.yaml"
  pull_request:
    paths:
      - "sol/**"
      - "js/sol/**"
      - "luna/src/**"
      - "luna/moon.mod"
      - "scripts/**"
      - "moon.work"
      # astra core only — astra/examples/** is owned by astra.yaml, not sol.
      - "astra/src/**"
      - "astra/moon.mod"
      - "astra/moon.pkg"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/sol.yaml"

permissions:
  contents: read

jobs:
  # sol Playwright (loader, hydration, async-streaming, etc.)
  sol-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: latest
      - run: |
          moon update
          node scripts/generate-examples.mjs
      - name: Build workspace
        run: moon build --target js --release
      - name: Install Playwright Chromium
        # Install via sol's own pnpm context so the headless-shell
        # cache path matches sol's @playwright/test version.
        run: cd sol && pnpm exec playwright install chromium --with-deps
      - name: sol Playwright
        run: cd sol && pnpm test:e2e
      - name: Sol app hydration
        run: cd sol && pnpm test:hydration
      - name: MoonBit Playwright over BiDi
        run: cd sol && pnpm test:mbt-e2e
