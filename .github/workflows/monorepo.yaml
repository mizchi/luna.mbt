name: monorepo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Prose is skipped, but `*.mbt.md` pages are compiled by `moon check` /
    # `moon test`, so they must re-run the workspace check. Later patterns
    # win, which is why the re-include comes last.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "**/*.mbt.md"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "**/*.mbt.md"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Workspace-wide moon check + moon test (covers luna + sol + astra).
  # Cheap and worth always running so cross-package breakage is caught early.
  workspace-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: latest
      - run: |
          moon update
          node scripts/generate-examples.mjs
      - name: Setup CJS test environment
        run: |
          mkdir -p _build/js/debug/test
          echo '{"type": "commonjs"}' > _build/js/debug/test/package.json
      - name: moon check (workspace — libraries + docs + examples)
        run: moon check --target js --deny-warn
      - name: Build workspace packages
        run: |
          node js/luna/scripts/build-moon.mjs
          cd js/wcr && pnpm build
          cd ../stella && pnpm build
      - name: TypeScript check
        run: pnpm tsc -b
      - name: moon test (workspace — libraries + docs + examples)
        run: moon test --target js

  # Cross-package node:test smokes (build/dev parity + examples matrix
  # + sol cli node:tests). Faster than the Playwright runs in per-package
  # workflows, so kept in the always-run monorepo workflow.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: latest
      - run: |
          moon update
          node scripts/generate-examples.mjs
      - name: Build workspace
        run: moon build --target js --release
      - name: Build debug for sol generate flow (sol_app/auth/todo)
        run: moon build --target js
      - name: Run integration smokes
        run: pnpm test:integration
      - name: sol cli node:tests
        run: |
          cd sol
          node --test e2e/moon-install.test.js
          node --test e2e/cli-golden-path.test.js
          node --test e2e/template-check.test.js
          node --test e2e/cloudflare-starter.test.js
          node --test e2e/generate-codegen.test.js
          node --test e2e/cli-bootstrap-environments.test.js
